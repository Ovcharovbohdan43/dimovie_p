name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install
        run: npm ci

      - name: Prisma generate
        run: npm run db:generate
        env:
          # generate does not need a live DB; placeholder satisfies schema env
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/dimovie

      - name: Build
        run: npm run build
        env:
          NEXT_PUBLIC_API_URL: http://127.0.0.1:4000
          NEXT_PUBLIC_WS_URL: http://127.0.0.1:4000
